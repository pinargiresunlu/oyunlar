<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yılan Oyunu 🐍</title>
  <style>
    body { background: #111; color: white; font-family: sans-serif; text-align: center; }
    canvas { background: #222; margin-top: 20px; border: 2px solid #555; }
    h1 { color: #f4f4f4; }
  </style>
</head>
<body>
  <h1>🐍 Yılan Oyunu</h1>
  <p>Başlamak veya yeniden başlamak için <strong>SPACE</strong> tuşuna bas</p>
  <canvas id="game" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake, food, dx, dy, gameOver, gameStarted;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      dx = 0;
      dy = 0;
      gameOver = false;
      gameStarted = false;
    }

    resetGame(); // Oyunu ilk açtığında başlat

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (!gameStarted || gameOver) {
          resetGame();
          dx = 1;
          dy = 0;
          gameStarted = true;
        }
      }

      if (gameStarted) {
        if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
        else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
        else if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
        else if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
      }
    });

    function drawGame() {
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Yiyecek (🍎)
      ctx.fillStyle = "red";
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

      // Yılan
      ctx.fillStyle = "lime";
      for (let segment of snake) {
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      }

      if (!gameStarted && !gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("SPACE tuşuna basarak başla", 70, 200);
      }

      if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "30px Arial";
        ctx.fillText("🚫 Oyun Bitti!", 110, 180);
        ctx.font = "18px Arial";
        ctx.fillStyle = "white";
        ctx.fillText("Yeniden başlamak için SPACE tuşuna bas", 50, 220);
      }
    }

    function updateGame() {
      if (!gameStarted || gameOver) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver = true;
        return;
      }

      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          gameOver = true;
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } else {
        snake.pop();
      }
    }

    function gameLoop() {
      updateGame();
      drawGame();
    }

    setInterval(gameLoop, 150);
  </script>
</body>
</html>
